<section class="products">
  <div class="header">
    <h2>Your Products</h2>
    <a routerLink="/seller/products/new" class="btn btn-primary">Add Product</a>
  </div>

  <p class="state" *ngIf="isLoading">Loading your products...</p>
  <p class="state error" *ngIf="!isLoading && errorMessage">
    {{ errorMessage }}
  </p>
  <div class="empty" *ngIf="!isLoading && !errorMessage && !products.length">
    <p>No products added by you yet.</p>
    <a routerLink="/seller/products/new" class="btn btn-secondary">
      Add Product
    </a>
  </div>

  <table class="product-table" *ngIf="!isLoading && products.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.name }}</td>
        <td>₹{{ product.price | number: '1.0-0' }}</td>
        <td>{{ stockLabel(product) }}</td>
        <td class="actions">
          <button class="btn btn-secondary" (click)="editProduct(product.id)">
            Edit
          </button>
          <button class="btn btn-ghost" (click)="deleteProduct(product.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
