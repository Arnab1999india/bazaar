<div class="login-container">
  <div class="login-card">
    <h2>Seller Sign In</h2>
    <p class="subtitle">Welcome back! Sign in to your seller account.</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            class="form-control"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="togglePasswordVisibility()"
          >
            <span>{{ showPassword ? "Hide" : "Show" }}</span>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid || isLoading"
      >
        {{ isLoading ? "Signing in..." : "Sign In" }}
      </button>
      <div class="links">
        <a (click)="navigateToForgotPassword()" class="link">Forgot Password?</a>
      </div>
    </form>

    <div class="divider">
      <span>New to Bazaar as a seller?</span>
    </div>
    <a routerLink="/auth/seller-register" class="btn btn-secondary btn-block">
      Create Seller Account
    </a>
  </div>
</div>
